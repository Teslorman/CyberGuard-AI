services:
  - type: web
    name: cyberguard-ai
    runtime: python
    plan: free
    buildCommand: >-
      python -m pip install --upgrade pip &&
      python -m pip install -r backend/requirements.txt &&
      python -m pip install semgrep==1.177.0 &&
      mkdir -p .tooling/gitleaks &&
      curl -fsSL -o /tmp/gitleaks.tar.gz
      https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/gitleaks_8.30.0_linux_x64.tar.gz &&
      curl -fsSL -o /tmp/gitleaks_checksums.txt
      https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/gitleaks_8.30.0_checksums.txt &&
      expected=$(grep 'gitleaks_8.30.0_linux_x64.tar.gz' /tmp/gitleaks_checksums.txt | awk '{print $1}') &&
      actual=$(sha256sum /tmp/gitleaks.tar.gz | awk '{print $1}') &&
      test "$expected" = "$actual" &&
      tar -xzf /tmp/gitleaks.tar.gz -C .tooling/gitleaks gitleaks &&
      npm --prefix frontend ci --no-audit --no-fund &&
      npm --prefix frontend run build
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: PUBLIC_ORIGIN
        sync: false
